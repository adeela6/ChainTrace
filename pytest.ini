[pytest]
testpaths = tests
pythonpath = .
addopts = --import-mode=importlib -ra
junit_family = xunit1
markers =
    evaluation_case(id, input, expected): T1-T6 / T-final test; shown as a row in docs/test-results.md
    slow: takes more than a few seconds (e.g. real server restart); skip with -m "not slow"
